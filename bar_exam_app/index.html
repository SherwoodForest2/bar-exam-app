<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתרגל בחינת הלשכה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 700px;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-outline { background-color: transparent; border: 2px solid #007bff; color: #007bff; }
        .btn-outline:hover { background-color: #007bff; color: white; }
        .btn-option {
            display: block;
            width: 100%;
            text-align: right;
            margin: 10px 0;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .btn-option:hover { background: #e2e6ea; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .incorrect { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .hidden { display: none; }
        #feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>✍️ מתרגל בחינת הלשכה</h1>
            <p>בוא נגיע למקצועיות מקסימלית</p>
        </div>

        <div id="setup-screen">
            <div class="mode-selector">
                <button class="btn-primary" onclick="startApp('learning')">מצב למידה (פידבק מיידי)</button>
                <button class="btn-outline" onclick="startApp('exam')">מצב בחינה (סיכום בסוף)</button>
            </div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div id="progress">שאלה 1 מתוך X</div>
            <h3 id="question-text">טוען שאלה...</h3>
            <div id="options-container"></div>
            <div id="feedback" class="hidden"></div>
            <button id="next-btn" class="btn-primary hidden" style="margin-top: 20px; width: 100%;">השאלה הבאה</button>
        </div>

        <div id="result-screen" class="hidden">
            <h2>סיכום בחינה</h2>
            <p id="score-text"></p>
            <button class="btn-primary" onclick="location.reload()">התחל מחדש</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIdx = 0;
        let score = 0;
        let mode = '';

        async function loadQuestions() {
            try {
                const resp = await fetch('questions.json');
                questions = await resp.json();
            } catch (e) {
                alert('שגיאה בטעינת השאלות');
            }
        }

        function startApp(selectedMode) {
            mode = selectedMode;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('progress').innerText = `שאלה ${currentIdx + 1} מתוך ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx, btn);
                container.appendChild(btn);
            });
        }

        function handleAnswer(idx, btn) {
            const q = questions[currentIdx];
            const isCorrect = idx === q.correct;
            const options = document.querySelectorAll('.btn-option');

            if (mode === 'learning') {
                options.forEach(b => b.disabled = true);
                if (isCorrect) {
                    btn.classList.add('correct');
                    showFeedback('נכון מאוד! 🌟', 'correct');
                    score++;
                } else {
                    btn.classList.add('incorrect');
                    options[q.correct].classList.add('correct');
                    showFeedback(`טעות. התשובה הנכונה היא: ${q.options[q.correct]}`, 'incorrect');
                }
                document.getElementById('next-btn').classList.remove('hidden');
            } else {
                if (isCorrect) score++;
                options.forEach(b => b.disabled = true);
                btn.style.backgroundColor = isCorrect ? '#d4edda' : '#f8d7da';
                document.getElementById('next-btn').classList.remove('hidden');
            }
        }

        function showFeedback(text, type) {
            const f = document.getElementById('feedback');
            f.innerText = text;
            f.className = type === 'correct' ? 'correct' : 'incorrect';
            f.classList.remove('hidden');
        }

        document.getElementById('next-btn').onclick = () => {
            currentIdx++;
            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `הסכור שלך: ${score} מתוך ${questions.length}`;
        }

        loadQuestions();
    </script>
</body>
</html>
